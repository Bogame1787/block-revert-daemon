[package]
name = "blkrevertd"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
fuser = "0.18"
libc = "0.2.189"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "blkrevertd"
path = "src/main.rs"
